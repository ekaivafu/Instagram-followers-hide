services:
  - type: web
    name: insta-follow-hide-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUPPORT_USERNAME
        value: "@tgekaiva"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: insta-follow-hide-db
          property: connectionString

databases:
  - name: insta-follow-hide-db
    plan: free
    databaseName: instafollowhide
    user: instafollowhide
